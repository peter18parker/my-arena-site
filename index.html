at We Left",runtime:"20 min",logline:"The last assembly. The lockers emptied. The names that stayed.",image:"/images/yearbook.jpg"},{number:"05",title:"Darkside, Forever",runtime:"26 min",logline:"Who we became — and the hallway that still knows us.",image:"/images/group-still.jpg"}],Wg=[{title:"Your ordinary, made immortal",copy:"The joke from the back bench. The photograph that never made the yearbook. Cinema is how we refuse to let them stay small.",icon:"film"},{title:"A reunion with a spine",copy:"Not another sprawling group chat. A production with a date, a director, and a reason to finally tell the story properly.",icon:"users"},{title:"Credit that outlives the batch",copy:"Your name in the roll. Your voice in the cut. A film your future self — and anyone who comes after — can actually sit with.",icon:"clapper"},{title:"Directed, not dumped",copy:"We are not stitching a montage and calling it memory. This is reported, scored, graded, and paced like the documentaries we grew up on.",icon:"spark"},{title:"Privacy, on your terms",copy:"Appear. Don’t appear. Speak off-record. Submit as a ghost. The archive is vaulted; nothing ships without your say.",icon:"shield"},{title:"A premiere worth dressing for",copy:"One night in a dark room with the people who were there. Then a private digital release — Netflix grammar, Darkside blood.",icon:"ticket"}],sh=[{name:"Ananya R.",role:"The one who kept the notes",quote:"I thought I had outgrown that year. Then they asked for the photographs. I found a version of myself I had filed under ‘don’t open.’ This film is the key.",image:"https://images.pexels.com/photos/33681513/pexels-photo-33681513.jpeg?auto=compress&cs=tinysrgb&w=800"},{name:"Kabir S.",role:"Back-bench, front-of-mind",quote:"We were never the golden batch. We were the ones the teachers still mention in the staff room. Someone had to put that on a screen.",image:"https://images.pexels.com/photos/16762656/pexels-photo-16762656.jpeg?auto=compress&cs=tinysrgb&w=800"},{name:"Meera D.",role:"Lab keys, 11:40 p.m.",quote:"If this were just a reunion video I wouldn’t have shown up. It’s a documentary. That means the ugly parts get a seat too. That’s why I said yes.",image:"https://images.pexels.com/photos/21316136/pexels-photo-21316136.jpeg?auto=compress&cs=tinysrgb&w=800"},{name:"Rohan V.",role:"The night-bus historian",quote:"I still have the cassette. They are scoring the film around it. Grown-up, employed, supposedly over it — and I cried in the booth. That’s the point.",image:"https://images.pexels.com/photos/32349722/pexels-photo-32349722.jpeg?auto=compress&cs=tinysrgb&w=800"},{name:"Diya K.",role:"We thought it was just a year",quote:"Submit the memory you never posted. The one that would not survive a caption. That’s the Darkside they are actually making.",image:"https://images.pexels.com/photos/7277962/pexels-photo-7277962.jpeg?auto=compress&cs=tinysrgb&w=800"},{name:"Ishaan P.",role:"Still has the mixtape",quote:"Netflix taught us how memory is supposed to look. We are finally giving our hallway that dignity. I am in — camera, credit, all of it.",image:"https://images.pexels.com/photos/15484274/pexels-photo-15484274.jpeg?auto=compress&cs=tinysrgb&w=800"}],$g=[{q:"Is this actually a Netflix documentary?",a:"DARKSIDE is independently produced in the grammar of a Netflix original — serialized chapters, cinematic grade, original score. We are not a Netflix commission. We are making the film our year deserved, then premiering it theatrically and privately streaming it to the batch."},{q:"Who can take part?",a:"Anyone who walked SPC as Class 12 Darkside — and the people who were gravitationally stuck to us. Partners, siblings, the teacher who stayed late: if you have a memory that belongs, the archive will take it."},{q:"Do I have to appear on camera?",a:"No. Ghost submissions are welcome. You can contribute photographs and writing, speak off-record, or sit for a full interview. Appearance is a choice, not a cover charge."},{q:"How is privacy handled?",a:"The vault is invitation-only. Nothing is published without a release. Faces can be withheld, names can be changed, and you may withdraw a memory until picture lock. We would rather lose a shot than lose someone’s trust."},{q:"What is the timeline?",a:"Archive is open now. Interviews run in rolling blocks. Picture lock is set for late 2026, with a single premiere night and a private digital window after. Verified batch members see chapters as they are cut."},{q:"Does any of this cost money?",a:"No. DARKSIDE is free to visit, free to join, and free to upload to — forever. There are no tiers, tickets, or paywalls. Memory shouldn’t have a cover charge; the only price of admission is the OTP we send to your phone."},{q:"Why do I have to verify a phone OTP?",a:"The vault is for the actual batch, not random drive-bys. We text a one-time code to the number you enter; the site opens only after that code is confirmed. Your number is never shown on the public wall."},{q:"Can I submit something raw — even ugly?",a:"Especially that. Darkside was never a highlight reel. If it happened, if it still lives in you, it belongs in the conversation with the director. We will tell you if it belongs in the cut."},{q:"I lost touch with everyone. Is it too late?",a:"The hallway is still there. So is your name. Send one photograph. That is enough to come home."}],qu=[{image:"/images/hero-still.jpg",caption:"SPC. Class 12. The year they named us Darkside."},{image:"/images/classroom.jpg",caption:"We were not supposed to last."},{image:"/images/rooftop.jpg",caption:"Some nights refuse to end."},{image:"/images/archive.jpg",caption:"Every photo. Every voice. Every version of us."},{image:"/images/group-still.jpg",caption:"This is the film we never got."}],Fg=["The one who kept the notes","Back-bench historian","Terrace regular","Lab-keys holder","Night-bus poet","The quiet one","The instigator","Someone’s first everything","I don’t know what I was","I was all of it"]
